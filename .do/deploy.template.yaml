# DigitalOcean App Platform template, read by the Deploy to DO button in README.md.
# The button only works when repo_clone_url is this repository. In your own copy, create the app
# from your repository instead (Create App → GitHub): the build and start scripts are detected.
spec:
  name: rapidoc-portal
  services:
    - name: portal
      git:
        repo_clone_url: https://github.com/rapi-doc/rapidoc-portal-starter.git
        branch: main
      environment_slug: node-js
      build_command: npm run build
      run_command: npm start
      http_port: 8080
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      health_check:
        http_path: /_rapidoc/health
