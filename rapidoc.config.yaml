# yaml-language-server: $schema=./node_modules/@rapidoc/portal/schema.json
site:
  title: "My Developer Portal"
  description: "Official developer portal and interactive API reference."
  # url: "https://developers.example.com"   # canonical links and sitemap; a path (https://example.com/developers) is where the portal is served
  # image: "/social-card.png"               # preview image for shared links (needs url)
  banner:
    message: "🎉 Welcome to our brand new developer portal!"
    href: "/docs/getting-started"

theme:
  primary: "#f59e0b"
  mode: auto
  # css: "./styles/portal.css"   # your stylesheet, loaded after the portal's own

# Tags added to every page, e.g. analytics:
# head:
#   - script: { src: "https://plausible.io/js/script.js", defer: true, data-domain: "example.com" }

# Row 1 of the header: links and menus right of the search
header:
  links:
    - label: "Solutions"
      items:
        - label: "Getting Started"
          icon: "rocket"
          description: "Quickstart guide and developer tutorials"
          href: "/docs/getting-started"
        - label: "Core API"
          icon: "lightning"
          description: "Interactive OpenAPI documentation"
          href: "/apis/core"
    - label: "Get started"
      href: "/docs/getting-started"
      style: primary

# Row 2 of the header: one tab per entry; a documentation tab has its own sidebar
navigation:
  - label: "Documentation"
    icon: "book"
    items:
      - label: "Guides"
        items:
          - getting-started
          - guides/overview
  - label: "Core API"
    icon: "code"
    api: core
  - label: "API Catalog"
    icon: "squares-four"
    catalog: true

apis:
  - id: core
    spec: "./specs/api.yaml"
# Several versions of one API: `versions` instead of `spec`. The first is the default, at /apis/<id>;
# the others are at /apis/<id>/<version>, with a version picker on the reference page.
#   versions:
#     - "./specs/api-v2.yaml"
#     - "./specs/api-v1.yaml"

# Arazzo workflow files: drawn by {% workflow file="<id>" /%} in docs pages and exported as MCP
# tools. A source description named like an API id resolves against that API's spec.
# workflows:
#   - file: "./workflows/checkout.arazzo.yaml"

rapidoc:
  render-style: "focused"
  schema-style: "tree"

# Each docs page is also published as Markdown, with /llms.txt for AI tools and "Copy page" buttons.
# llms: false   # turns that off

# Optional: sign-in through your OpenID Connect provider and access rules, enforced by
# `rapidoc serve` (npm install @rapidoc/server). Secrets are environment variables of the server:
# RAPIDOC_SESSION_SECRET and RAPIDOC_AUTH_CLIENT_SECRET.
# auth:
#   issuer: "https://your-tenant.okta.com/oauth2/default"
#   clientId: "portal-web"
#   tryIt: true   # Try in the API reference sends the signed-in reader's access token
# access:
#   default: public
#   rules:
#     - path: /docs/internal/**
#       allow: signed-in
